<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUTON room · 象</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>FUTON room <span>· 象</span></h1><div id="identity"></div></header>
  <section id="login" class="login">
    <h2>Join with Matrix</h2>
    <p>Private Federation Proof · <code>matrix.paragogy.net</code></p>
    <form id="login-form">
      <label>Username <input id="username" autocomplete="username" value="joe"></label>
      <label>Password <input id="password" type="password" autocomplete="current-password"></label>
      <button>Sign in</button><span id="login-status"></span>
    </form>
    <p class="small"><a id="element-link">Open this room in full Element instead</a></p>
  </section>
  <main id="app" hidden>
    <section class="conversation">
      <div class="legend"><span class="declared">declared mark</span><span class="inferred">象 interpretation</span></div>
      <ol id="messages"></ol>
      <form id="composer">
        <select id="agent" aria-label="agent"><option value="fucodex">codex-1</option><option value="fuclaude">claude-1</option><option value="fuzai">zai-1</option><option value="">room only</option></select>
        <textarea id="message" rows="3" placeholder="Write to the room…" required></textarea>
        <button>Send</button>
      </form>
    </section>
    <aside id="inspector"><h2>象 reading</h2><p class="muted">Select a marked turn.</p></aside>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
