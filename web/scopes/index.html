<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scope view</title>
  <style>
    :root { color-scheme: light; font: 15px/1.45 system-ui, sans-serif; }
    body { margin: 0; background: #f5f4ef; color: #222; }
    #scopes { max-width: 1500px; margin: auto; padding: 1.25rem; }
    .scope-controls { display: flex; gap: 2rem; align-items: start; margin-bottom: 1rem; }
    .scope-layers { display: flex; gap: 1rem; border: 1px solid #bbb; background: white; }
    .scope-layer-toggle { display: flex; align-items: center; gap: .35rem; }
    .scope-swatch { width: .9rem; height: .9rem; border: 1px solid #777; }
    .ink-c { background: cyan; } .ink-m { background: magenta; } .ink-y { background: yellow; }
    .scope-legend { max-width: 54rem; } .scope-legend dl { columns: 2; }
    .scope-legend dt { font-weight: 700; break-after: avoid; }
    .scope-legend dt.undefined { color: #a21; }
    .scope-legend dd { margin: 0 0 .55rem; break-inside: avoid; }
    .scope-columns { display: grid; grid-template-columns: minmax(0, 2fr) minmax(18rem, 1fr); gap: 1rem; }
    .scope-segment { background: white; border: 1px solid #ccc; margin: 0 0 1rem; padding: .8rem; }
    .scope-segment-label { margin: 0 0 .55rem; font-size: .9rem; color: #555; }
    .scope-segment-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(13rem, .55fr); gap: .9rem; }
    .scope-text { white-space: pre-wrap; overflow-wrap: anywhere; font-family: ui-monospace, monospace; }
    .scope-piece { transition: outline .12s; } .scope-mark { font: 700 .78rem system-ui; margin-right: .15rem; }
    [data-span].lit { outline: 2px solid #111; outline-offset: 1px; }
    .scope-notes { margin: 0; padding-left: 1.5rem; font-size: .8rem; }
    .scope-note { padding: .25rem; margin-bottom: .4rem; } .scope-note p { margin: 0 0 .2rem; }
    .scope-edge { display: block; border: 0; padding: .12rem 0; color: #0645ad; background: none; text-align: left; cursor: pointer; }
    .scope-edge.stub { color: #777; cursor: default; }
    .scope-side .scope-segment { font-size: .78rem; } .scope-side .scope-segment-body { display: block; }
    .scope-side .scope-notes { margin-top: .6rem; }
    .grid-head h1 { font-size: 1.1rem; margin: 0 0 .3rem; } .grid-counts { margin: 0 0 .8rem; color: #444; }
    .grid-legend { columns: 2; max-width: 60rem; font-size: .85rem; margin-bottom: 1rem; }
    .grid-legend dt { font-weight: 700; break-after: avoid; } .grid-legend dd { margin: 0 0 .4rem; break-inside: avoid; }
    .grid-columns { display: grid; grid-template-columns: minmax(0, 3fr) minmax(18rem, 1fr); gap: 1rem; }
    .grid-table { border-collapse: collapse; background: white; border: 1px solid #ccc; font: .82rem ui-monospace, monospace; }
    .grid-table th, .grid-table td { padding: .1rem .3rem; border-bottom: 1px solid #eee; text-align: center; }
    .grid-table th { position: sticky; top: 0; background: #fafafa; }
    .grid-turn { text-align: left !important; white-space: nowrap; } .grid-calls { color: #777; }
    .grid-row-quiet td { color: #bbb; } .grid-row-quiet .grid-turn { color: #888; }
    .grid-cell.level-retrieved-only { color: #777; } .grid-cell.level-reached { color: #0645ad; } .grid-cell.level-echoed { color: #a21; font-weight: 700; }
    .grid-cell[class*="status-"]:not(.status-in-force) { background: #fff3c4; }
    .grid-memory-name, .grid-edge { border: 0; background: none; color: #0645ad; cursor: pointer; font: inherit; padding: 0; text-align: left; }
    th.grid-memory.lit { outline: 2px solid #111; outline-offset: -2px; }
    .grid-key { font-size: .8rem; padding-left: 1.4rem; columns: 1; } .grid-key li { margin: 0 0 .1rem; }
    .grid-detail { font-size: .8rem; background: white; border: 1px solid #ccc; padding: .6rem; margin-top: .8rem; }
    .grid-detail h2 { font-size: .95rem; margin: 0 0 .3rem; } .grid-events { padding-left: 1rem; }
    .grid-events li { margin-bottom: .35rem; } .grid-event-when { font-weight: 700; white-space: nowrap; }
    .event-unsaid .grid-event-when { color: #a21; } .event-again .grid-event-when { color: #0a7; }
    @media (max-width: 850px) { .scope-columns, .scope-segment-body, .grid-columns { grid-template-columns: 1fr; } .scope-controls { display: block; } }
  </style>
</head>
<body>
  <p style="max-width:1500px;margin:.6rem auto 0;padding:0 1.25rem;font-size:.85rem;color:#555">Worked example: <a href="useful.html">one memory followed through four dates</a>, with what reaching it was worth.</p>
  <div id="scopes">Loading…</div>
  <script type="module">
    import { renderScopes } from "./scopes.js";
    import { renderGrid } from "./grid.js";
    const host = document.querySelector("#scopes");
    try {
      // ?session=zai-2 draws the memory layer over that seat's whole session
      // (fixtures/over-time-<seat>.json); ?turn=<id> draws one turn.
      const params = new URLSearchParams(location.search);
      const session = params.get("session");
      const turn = params.get("turn") || "claude-16-turn-162";
      const response = await fetch(session ? `./fixtures/over-time-${session}.json` : `./fixtures/${turn}.json`);
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      if (session) renderGrid(await response.json(), host, { turnHref: (row) => `?turn=${row.turn}` });
      else renderScopes(await response.json(), host);
    } catch (error) {
      host.textContent = `Could not load scope data: ${error}`;
    }
  </script>
</body>
</html>
