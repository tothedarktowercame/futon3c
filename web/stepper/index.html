<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>象 stepper</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#242424;background:#f5f4ed} body{max-width:76rem;margin:0 auto;padding:1rem}
    #stepper{background:#fff;border:1px solid #ccc;padding:1rem}.stepper-status{position:sticky;top:0;background:#242424;color:#fff;padding:.45rem .7rem;font:600 .9rem ui-monospace,monospace}
    .stepper-frame{max-width:70rem}.stepper-frame section{border-bottom:1px solid #ddd;padding:.65rem 0}.stepper-frame h2,.said-link,.stepper-frame>section>span:first-child{font-size:.9rem;font-weight:700;color:#333}
    .said-link{color:#0645ad}.said-text{white-space:pre-wrap}.stepper-section,.parse-line{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace;margin:.25rem 0}
    .parse-cue{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:purple;text-decoration-thickness:1.5px}.parse-sources{padding-left:1.5rem;color:#555}.provisional{color:#777;font-style:italic}.provisional .parse-head{color:#777}
    .stepper-footer{margin-top:.8rem;color:#666;font-size:.8rem}.help{color:#555;font-size:.82rem;margin:.3rem 0 1rem}
  </style>
</head>
<body>
  <h1>象 stepper</h1>
  <p class="help">n / → next · p / ← previous · Home / End · g refetch.
    Live: <code>?agent=claude-16</code> (the seat's current session, from the roster) or <code>?session=&lt;id&gt;</code>;
    opens on the newest turn and refetches every <code>poll</code> seconds (default 30, <code>poll=0</code> to stop). Without either, a fixture.</p>
  <div id="stepper">Loading…</div>
  <script type="module">
    import {renderStepper} from './stepper.js';
    const params = new URLSearchParams(location.search);
    // Default base: this page's directory, where the zone site forwards
    // api/alpha/xiang/* and api/alpha/agents to the Agency. On the box:
    // ?base=http://localhost:7070.
    const base = (params.get('base') || new URL('.', location.href).href).replace(/\/$/, '');
    const limit = params.get('limit') || '60';
    const agent = params.get('agent');
    const host = document.querySelector('#stepper');
    let session = params.get('session');
    async function resolveAgent(id) {
      // GET /api/alpha/agents: the roster, each seat with its current session-id.
      const response = await fetch(`${base}/api/alpha/agents`);
      if (!response.ok) throw new Error(`roster: ${response.status} ${response.statusText}`);
      const roster = (await response.json()).agents || {};
      const entry = roster[id];
      if (!entry || !entry['session-id']) throw new Error(`${id} is not on the roster, or has no session`);
      return entry['session-id'];
    }
    async function load() {
      const url = session
        ? `${base}/api/alpha/xiang/frames?session=${encodeURIComponent(session)}&limit=${encodeURIComponent(limit)}`
        : './fixtures/frames-claude-16-00e653e3.json';
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      const value = await response.json();
      if (session && !value.ok) throw new Error(value.reason || 'frames endpoint returned ok:false');
      return session ? value.frames : value;
    }
    try {
      if (!session && agent) session = await resolveAgent(agent);
      const frames = await load(); host.textContent = '';
      const frame = params.get('frame') ? Number(params.get('frame')) : undefined;
      const pollMs = 1000 * Number(params.get('poll') ?? '30');
      renderStepper(frames, host, {frame, live: !!session, refetch: load, pollMs});
    } catch (error) {
      host.textContent = `Could not load frames: ${error}`;
    }
  </script>
</body>
</html>
